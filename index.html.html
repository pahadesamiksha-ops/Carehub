<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CareHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: marketing page, split auth screen, then a dark-sidebar app shell with five views. Calm green, soft cards. */
:root{
  --bg:#f6f8f7; --surface:#ffffff; --ink:#0e1b17; --muted:#5a6b65; --line:#e1e8e5;
  --brand:#1b4d3e; --brand-ink:#ffffff; --mint:#0f9d6e; --mint-soft:#dcf7ea; --mint-ink:#0a6b4a;
  --side:#0d1b2a; --side-ink:#c9d6e2; --side-muted:#8da2b5; --side-card:#12263a;
  --safe:#0f3a2e; --safe-line:#17503f; --danger:#c8123a; --danger-soft:#ffe9ee; --amber:#b45309; --amber-soft:#fff3dc;
  --c1:#2f7de1; --c2:#6a5ae0; --c3:#0f9d6e; --field:#ffffff; --shadow:0 1px 2px rgba(15,40,32,.05),0 8px 24px rgba(15,40,32,.05);
  --display:'Outfit',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1310; --surface:#101e19; --ink:#e7f1ed; --muted:#97aca3; --line:#1e322b;
  --brand:#2c8a6a; --brand-ink:#ffffff; --mint:#3ddc9a; --mint-soft:#12382b; --mint-ink:#6ee7b7;
  --side:#07100d; --side-card:#0e1c17; --safe:#0d2a21; --safe-line:#18483a; --danger:#ff6b87; --danger-soft:#3a1420; --amber:#f5b25c; --amber-soft:#35260f;
  --c1:#6aa6ff; --c2:#9a8cff; --c3:#3ddc9a; --field:#0c1814; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1310; --surface:#101e19; --ink:#e7f1ed; --muted:#97aca3; --line:#1e322b;
  --brand:#2c8a6a; --brand-ink:#ffffff; --mint:#3ddc9a; --mint-soft:#12382b; --mint-ink:#6ee7b7;
  --side:#07100d; --side-card:#0e1c17; --safe:#0d2a21; --safe-line:#18483a; --danger:#ff6b87; --danger-soft:#3a1420; --amber:#f5b25c; --amber-soft:#35260f;
  --c1:#6aa6ff; --c2:#9a8cff; --c3:#3ddc9a; --field:#0c1814; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mint-ink);font-weight:500}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 18px;font-weight:600;font-size:14.5px;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.lg{padding:15px 24px;font-size:15.5px;border-radius:16px}
.btn.danger{color:var(--danger);border-color:transparent;background:none;padding:0;font-weight:600}
.btn.sm{padding:8px 14px;border-radius:12px;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600}
.pill.emerg{background:var(--danger-soft);color:var(--danger);border:1px solid transparent;text-decoration:none}

/* landing */
.land-head{display:flex;align-items:center;justify-content:space-between;padding-block:22px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;border:0;background:none;padding:0}
.logo i{width:42px;height:42px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(27,77,62,.25)}
.land-nav{display:flex;align-items:center;gap:22px}
.land-nav .lnk{border:0;background:none;color:var(--muted);font-weight:500;padding:6px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding-block:56px 40px}
.hero h1{font-size:clamp(42px,6.2vw,76px);font-weight:700;margin-block:18px 22px}
.hero .lead{font-size:19px;color:var(--muted);max-width:34em}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-block:30px 26px}
.trust{display:flex;flex-wrap:wrap;gap:20px;color:var(--muted);font-size:13.5px;font-weight:500}
.trust span{display:inline-flex;align-items:center;gap:8px}
.trust svg{color:var(--mint)}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);padding:20px;min-width:0}
.mock-head{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mock-head .ic{width:40px;height:40px;border-radius:12px;background:var(--mint-soft);color:var(--mint-ink);display:grid;place-items:center}
.mock-head small{display:block;color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mint);margin-left:auto}
.bubble{border-radius:20px;padding:14px 18px;max-width:88%}
.bubble.u{background:var(--brand);color:var(--brand-ink);margin:18px 0 12px auto;width:fit-content}
.bubble.a{background:var(--bg);color:var(--muted)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-block:12px}
.tag{font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 12px;background:var(--mint-soft);color:var(--mint-ink)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.mock .note{background:var(--bg);border-radius:14px;padding:11px 14px;color:var(--muted);font-size:13.5px;margin-top:6px}
.sec{padding-block:64px}
.sec h2{font-size:clamp(30px,4vw,46px);font-weight:700;margin-top:14px;max-width:16em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);min-width:0}
.step{min-height:200px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);box-shadow:none}
.step .top{display:flex;justify-content:space-between;color:var(--mint-ink);font-family:var(--mono);font-size:12px}
.step h3{font-size:22px;margin-bottom:8px}
.step p,.guard p{color:var(--muted)}
.guard-wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:center}
.guard-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.guard h3{font-size:18px;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.guard h3 svg{color:var(--mint)}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;padding-block:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* auth */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.auth-l{background:#1b4d3e;color:#fff;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-l .logo{color:#fff}
.auth-l .logo i{background:rgba(255,255,255,.14);box-shadow:none}
.auth-l h1{font-size:clamp(36px,4.4vw,58px);font-weight:700;margin-block:18px 20px}
.auth-l .eyebrow{color:#8ff0c4}
.auth-l p.lead{color:#bfe4d3;font-size:18px;max-width:26em}
.auth-l ul{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:12px;color:#e2f6ec}
.auth-l li{display:flex;gap:12px;align-items:center}
.auth-r{display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.auth-box{width:100%;max-width:440px}
.shield{width:60px;height:60px;border-radius:18px;background:var(--mint-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:24px}
.auth-box h2{font-size:36px;font-weight:700}
.auth-box .sub{color:var(--muted);margin-block:8px 24px;font-size:17px}
label.f{display:block;font-weight:600;font-size:14.5px;margin-top:18px;margin-bottom:8px}
.in,select.in,textarea.in{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;color:var(--ink)}
textarea.in{resize:vertical;min-height:110px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);background:var(--danger-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:16px}
.auth-box .btn.primary{width:100%;justify-content:center;margin-top:22px;padding:16px;font-size:16px;border-radius:16px}
.swap{margin-top:22px;color:var(--muted)}
.swap button{border:0;background:none;padding:0;text-decoration:underline;color:inherit}

/* app shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));gap:12px;flex-wrap:wrap}
.top .logo{font-size:21px}
.top .logo i{width:36px;height:36px;border-radius:11px;box-shadow:none}
.top-r{display:flex;gap:10px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);align-items:start;align-content:start;min-height:calc(100vh - 69px)}
.side{background:var(--side);color:var(--side-ink);padding:24px 16px;position:sticky;top:69px;min-height:calc(100vh - 69px);display:flex;flex-direction:column;gap:22px}

.who small.eyebrow{color:#5be0a8;font-size:11px}
.who b{display:block;font-family:var(--display);font-size:22px;color:#fff;margin-top:8px;word-break:break-word}
.who span{color:var(--side-muted);font-size:14px;word-break:break-all}
.nav{display:grid;gap:6px}
.nav a{display:flex;gap:14px;align-items:center;text-decoration:none;padding:13px 18px;border-radius:16px;font-weight:600;color:var(--side-ink)}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a[aria-current="page"]{background:#176148;color:#fff}
.safety{margin-top:auto;background:var(--safe);border:1px solid var(--safe-line);border-radius:22px;padding:20px;color:#c4e6d8}
.safety .eyebrow{color:#5be0a8;letter-spacing:.2em;font-weight:700}
.safety p{font-size:14px;margin-top:12px}
.main{padding:34px clamp(20px,3.4vw,44px) 56px;min-width:0}
.main>header{margin-bottom:26px}
.main h1{font-size:clamp(32px,4.4vw,48px);font-weight:700;margin-top:8px}
.main .sub{color:var(--muted);margin-top:12px;font-size:16.5px;max-width:42em}
.row-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:22px}
.stat b{display:block;font-family:var(--display);font-size:38px;line-height:1;font-weight:600;letter-spacing:-.02em}
.stat strong{display:block;margin-top:8px;font-weight:600}
.stat span{color:var(--muted);font-size:13.5px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:18px}
.chart-card h3{font-size:24px;margin:8px 0 14px}
.chart-card .top2{display:flex;justify-content:space-between;align-items:baseline}
.link{border:0;background:none;color:var(--mint-ink);font-weight:600;padding:0;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chart-wrap{overflow-x:auto}
.empty{border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}
.steps-card{background:#1b4d3e;border-color:#1b4d3e;color:#fff;display:flex;flex-direction:column;gap:14px}
.steps-card h3{font-size:30px}
.steps-card p{color:#c1e5d4}
.steps-card .link{color:#fff;margin-top:auto}

/* tracker */
.tgrid{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:start}
.card h3.t{font-size:22px}
.card .sm{color:var(--muted);font-size:14px;margin-top:4px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-top:12px}
.entry b{font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.entry p{color:var(--muted);font-size:14px}
.entry .note{font-size:13px;margin-top:2px}
.del{border:0;background:none;color:var(--muted);display:inline-flex;gap:6px;align-items:center;font-size:13.5px;padding:6px}
.del:hover{color:var(--danger)}
.saved{color:var(--mint-ink);font-weight:600;margin-left:12px;font-size:14px}

/* library */
.search{display:flex;gap:12px;margin-bottom:20px}
.search .in{border-radius:16px;padding:16px 20px;font-size:16px}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lib .card{display:flex;flex-direction:column;gap:12px}
.lib .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;gap:8px}
.lib h3{font-size:21px}
.lib p{color:var(--muted)}
.lib .foot2{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:auto;font-size:13px;color:var(--muted)}
.lib .foot2 a{color:var(--mint-ink);font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}

/* chat */
.chat{padding:0;overflow:hidden}
.chat-h{display:flex;gap:14px;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.chat-h .ic{width:46px;height:46px;border-radius:14px;background:var(--mint-soft);color:var(--mint-ink);display:grid;place-items:center}
.chat-h small{display:block;color:var(--muted);font-size:13.5px}
.ready{margin-left:auto;color:var(--mint-ink);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.ready i{width:9px;height:9px;border-radius:50%;background:var(--mint)}
.msgs{padding:26px 24px;display:flex;flex-direction:column;gap:14px;min-height:380px;max-height:56vh;overflow-y:auto}
.welcome{margin:auto;text-align:center;max-width:34em;padding:20px 0}
.welcome svg{margin:0 auto 18px;color:var(--mint)}
.welcome h2{font-size:28px;margin-bottom:10px}
.welcome p{color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--mint)}
.m{max-width:78%;border-radius:20px;padding:14px 18px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.m.urgent{border-color:var(--danger);background:var(--danger-soft)}
.m .srcs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.m .srcs a{font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 12px;background:var(--mint-soft);color:var(--mint-ink);text-decoration:none}
.composer{display:flex;gap:12px;padding:16px 24px;border-top:1px solid var(--line)}
.composer .in{border-radius:999px}
.typing{color:var(--muted);font-size:14px}

.qpanel{border-top:1px solid var(--line);padding:18px 24px 22px;background:var(--surface)}
.qh{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.topics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.topic{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--muted)}
.topic.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.qlist{display:grid;gap:8px}
.qbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:500}
.qbtn:hover{border-color:var(--mint)}
.qbtn svg{flex:none;color:var(--mint-ink)}
.qbtn.done{color:var(--muted)}

/* profile */
.pgrid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:18px;align-items:start}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.fgrid label.f{margin-top:20px}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:22px;color:var(--muted)}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--brand)}
.privacy{background:var(--mint-soft);border-color:transparent;box-shadow:none}
.privacy svg{color:var(--mint-ink);margin-bottom:12px}
.privacy h3{font-size:24px;margin-bottom:10px}
.privacy p{color:var(--mint-ink);opacity:.9}
.side-col{display:grid;gap:18px}
.confirm{background:var(--danger-soft);border-radius:14px;padding:14px;margin-top:14px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;z-index:50}

@media (max-width:980px){
  .hero,.guard-wrap,.two,.tgrid,.pgrid{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}
  .auth-l{padding-block:32px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side,.main{min-width:0}
  .side{position:static;min-height:0;padding:14px 12px;flex-direction:column;gap:12px}
  .who{display:none}
  .nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:2px}
  .nav a{white-space:nowrap;padding:10px 16px}
  .safety{display:none}
  .land-nav .lnk{display:none}
}
@media (max-width:640px){
  .stats,.lib,.fgrid,.guard-grid{grid-template-columns:minmax(0,1fr)}
  .top .pill.emerg span.long{display:none}
  .m{max-width:92%}
  .search{flex-direction:column}
  .hero{padding-top:28px;gap:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

  var asked=(u.chat||[]).filter(function(x){return x.r==='u'}).length;
  function st(ico,bg,fg,val,lab,sub){return '<div class="card stat"><div class="ic" style="background:'+bg+';color:'+fg+'">'+ic(ico,22)+'</div><b>'+val+'</b><strong>'+lab+'</strong><span>'+sub+'</span></div>'}
  m.innerHTML='<header class="row-h"><div><div class="eyebrow">Personal wellness cockpit</div><h1>'+gr+', '+esc(u.name)+'.</h1><p class="sub">A calm view of your everyday habits, questions, and trusted health education.</p></div>'+
  '<button class="btn primary" data-go="guidance">'+ic('bot',18)+'Ask CareHub</button></header>'+
  '<div class="stats">'+
  st('drop','var(--mint-soft)','var(--c1)',(t.water||0)+'/'+(p.water||8),'Water glasses','Today’s logged intake')+
  st('sleep','var(--mint-soft)','var(--c2)',(t.sleep||0)+'h','Sleep','Goal '+(p.sleep||8)+' hours')+
  st('pulse','var(--mint-soft)','var(--c3)',(t.move||0)+'m','Movement','Minutes logged today')+
  st('help','var(--mint-soft)','var(--c2)',asked,'Questions asked','Private conversations')+'</div>'+
  '<div class="two"><div class="card chart-card"><div class="top2"><span class="eyebrow" style="color:var(--muted)">Your rhythm</span><button class="link" data-go="tracker">View tracker '+ic('chev',16)+'</button></div><h3>Weekly wellness signals</h3>'+chart(u)+'</div>'+
  '<div class="card steps-card"><span>'+ic('target',26)+'</span><h3>Small steps count.</h3><p>Choose a next step that fits your life, then use your own entries to notice patterns.</p><button class="link" data-go="library">Explore trusted sources '+ic('chev',16)+'</button></div></div>';
}
function chart(u){
  var days=[],i;for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  var has=(u.entries||[]).some(function(e){return days.some(function(d){return iso(d)===e.date})});
  if(!has) return '<div class="empty">No check-ins in the last 7 days yet. Log one and your pattern will show here.<br><button class="btn sm" data-go="tracker">Log a check-in</button></div>';
  var W=640,H=230,L=44,R=14,T=14,B=34,pw=W-L-R,ph=H-T-B,p=u.profile;
  var S=[{k:'water',c:'var(--c1)',g:+p.water||8,n:'Water'},{k:'sleep',c:'var(--c2)',g:+p.sleep||8,n:'Sleep'},{k:'move',c:'var(--c3)',g:30,n:'Movement (30 min = 100%)'}];
  var X=function(i){return L+pw*i/6}, Y=function(v){return T+ph*(1-Math.min(v,120)/120)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:420px" role="img" aria-label="Weekly water, sleep and movement as a percent of goal">';
  [0,50,100].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" '+(v===100?'stroke-dasharray="4 4"':'')+'/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'%</text>'});
  days.forEach(function(d,i){s+='<text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+d.toLocaleDateString('en',{weekday:'short'})+'</text>'});
  S.forEach(function(se){
    var pts=[];days.forEach(function(d,i){var e=entryFor(u,iso(d));if(e)pts.push([X(i),Y((+e[se.k]||0)/se.g*100)])});
    if(pts.length>1)s+='<polyline fill="none" stroke="'+se.c+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p.join(',')}).join(' ')+'"/>';
    pts.forEach(function(p,j){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(j===pts.length-1?5:3.5)+'" fill="'+se.c+'"/>'});
  });
  s+='</svg>';
  return '<div class="chart-wrap">'+s+'</div><div class="legend">'+S.map(function(x){return '<span><i style="background:'+x.c+'"></i>'+x.n+'</span>'}).join('')+'<span>Dashed line = goal</span></div>';
}

/* guidance */
function vGuidance(m,u){
  m.innerHTML='<header class="row-h"><div><div class="eyebrow">Symptom education &amp; wellness</div><h1>Ask with context. Act with care.</h1><p class="sub">Pick a question and CareHub shows approved public-health guidance with its sources. It never diagnoses or replaces a clinician.</p></div>'+
  '<button class="btn" data-clear>'+ic('trash',16)+'Clear chat</button></header>'+
  '<div class="card chat"><div class="chat-h"><div class="ic">'+ic('bot',22)+'</div><div><b>CareHub guide</b><small>Grounded wellness education · private session</small></div><span class="ready"><i></i>Ready</span></div>'+
  '<div class="msgs" id="msgs" aria-live="polite"></div><div class="qpanel" id="qpanel"></div></div>';
  drawMsgs(u);drawPanel(u);
}
function asked(u,q){return u.chat.some(function(c){return c.r==='u'&&c.t===q})}
function drawPanel(u){
  var el=document.getElementById('qpanel');if(!el)return;
  el.innerHTML='<div class="qh">Choose a question</div><div class="topics" role="tablist">'+
  TOPICS.map(function(t){return '<button role="tab" aria-selected="'+(t.id===curTopic)+'" class="topic'+(t.id===curTopic?' on':'')+'" data-topic="'+t.id+'">'+t.n+'</button>'}).join('')+'</div><div class="qlist">'+
  QA.map(function(x,i){return x.t===curTopic?'<button class="qbtn'+(asked(u,x.q)?' done':'')+'" data-q="'+i+'"><span>'+esc(x.q)+'</span>'+(asked(u,x.q)?ic('check',16):ic('chev',16))+'</button>':''}).join('')+'</div>';
}
function drawMsgs(u){
  var el=document.getElementById('msgs');if(!el)return;
  if(!u.chat.length){
    el.innerHTML='<div class="welcome">'+ic('spark',40)+'<h2>What would you like to understand?</h2><p>Choose a question below about sleep, hydration, nutrition, movement, or stress. You’ll see the sources behind each answer.</p><div class="chips">'+
    [0,4,7].map(function(i){return '<button class="chip" data-q="'+i+'">'+esc(QA[i].q)+'</button>'}).join('')+'</div></div>';return;
  }
  el.innerHTML=u.chat.map(function(c){
    if(c.r==='u')return '<div class="m u">'+esc(c.t)+'</div>';
    return '<div class="m a'+(c.k==='urgent'?' urgent':'')+'">'+esc(c.t)+
    (c.s&&c.s.length?'<div class="srcs">'+c.s.map(function(id){var l=lib(id);return l?'<a href="'+l.url+'" target="_blank" rel="noopener">'+esc(l.src)+': '+esc(l.title)+'</a>':''}).join('')+'</div>':'')+
    '<div class="srcs"><span class="tag '+(c.k==='edu'?'warn':'')+'">'+(c.k==='urgent'?'Urgent guidance':c.k==='decline'?'Outside what CareHub can do':'Education only')+'</span></div></div>';
  }).join('');
  el.scrollTop=el.scrollHeight;
}
function ask(i,u){
  var x=QA[i];if(!x)return;
  var qo={r:'u',t:x.q};u.chat.push(qo);drawMsgs(u);drawPanel(u);
  var el=document.getElementById('msgs');el.insertAdjacentHTML('beforeend','<div class="m a typing" id="typ">Looking at approved sources…</div>');el.scrollTop=el.scrollHeight;
  save();
  setTimeout(function(){
    if(u.chat.indexOf(qo)<0)return;
    u.chat.push({r:'a',t:x.a(u),s:x.s,k:x.k});save();
    if(document.getElementById('msgs'))drawMsgs(u);
  },450);
}

/* tracker */
function vTracker(m,u){
  var p=u.profile;
  m.innerHTML='<header><h1>Wellness tracker</h1><p class="sub">Only values you log appear here. Use check-ins to notice patterns, not to grade yourself.</p></header>'+
  '<div class="tgrid"><form class="card" id="tf" novalidate><h3 class="t">Log a check-in</h3><p class="sm">Your data stays private to your account.</p>'+
  '<label class="f" for="t-date">Date</label><input class="in" type="date" id="t-date" value="'+todayISO()+'" max="'+todayISO()+'">'+
  '<label class="f" for="t-water">Water glasses</label><input class="in" type="number" id="t-water" min="0" max="30" step="1" value="0"><div class="hint">Goal: '+(p.water||8)+'</div>'+
  '<label class="f" for="t-sleep">Sleep hours</label><input class="in" type="number" id="t-sleep" min="0" max="24" step="0.5" value="0"><div class="hint">Goal: '+(p.sleep||8)+'</div>'+
  '<label class="f" for="t-move">Activity minutes</label><input class="in" type="number" id="t-move" min="0" max="600" step="5" value="0">'+
  '<label class="f" for="t-note">How did today feel?</label><textarea class="in" id="t-note" maxlength="280" placeholder="Optional note"></textarea>'+
  '<div id="t-err"></div><div style="margin-top:20px;display:flex;align-items:center"><button class="btn primary" type="submit">Save check-in</button></div></form>'+
  '<div class="card"><div class="eyebrow" style="color:var(--muted)">Your entries</div><h3 class="t" style="font-size:26px;margin-top:6px">Recent check-ins</h3><div id="elist"></div></div></div>';
  drawEntries(u);
  document.getElementById('tf').addEventListener('submit',function(ev){
    ev.preventDefault();
    var d=document.getElementById('t-date').value,w=+document.getElementById('t-water').value,s=+document.getElementById('t-sleep').value,a=+document.getElementById('t-move').value;
    var err=document.getElementById('t-err');
    if(!d){err.innerHTML='<div class="err">Pick a date for this check-in.</div>';return}
    if(w<0||s<0||a<0||s>24||isNaN(w+s+a)){err.innerHTML='<div class="err">Enter numbers that make sense: sleep between 0 and 24 hours, no negative values.</div>';return}
    err.innerHTML='';
    u.entries=u.entries.filter(function(e){return e.date!==d});
    u.entries.push({date:d,water:w,sleep:s,move:a,note:document.getElementById('t-note').value.trim()});
    u.entries.sort(function(a,b){return a.date<b.date?1:-1});save();drawEntries(u);ev.target.reset();document.getElementById('t-date').value=todayISO();toast('Check-in saved. The form is ready for a new entry.');
  });
}
function drawEntries(u){
  var el=document.getElementById('elist');if(!el)return;
  if(!u.entries.length){el.innerHTML='<div class="empty" style="margin-top:14px">Nothing logged yet. Save your first check-in, or load three example days to see how the tracker looks.<br><button class="btn sm" data-sample>Load example entries</button></div>';return}
  el.innerHTML=u.entries.slice(0,14).map(function(e){
    return '<div class="entry"><div><b>'+e.date+'</b><p>'+e.water+' glasses · '+e.sleep+'h sleep · '+e.move+'m movement</p>'+(e.note?'<p class="note">'+esc(e.note)+'</p>':'')+'</div><button class="del" data-del="'+e.date+'" aria-label="Delete entry '+e.date+'">'+ic('trash',15)+'Delete</button></div>';
  }).join('');
}

/* library */
function vLibrary(m,u){
  m.innerHTML='<header><h1>Health library</h1><p class="sub">Explore source-preserving education from MedlinePlus, NHS, WHO, and NIMH.</p></header>'+
  '<form class="search" id="sf"><label for="sq" style="position:absolute;left:-9999px">Search the library</label><input class="in" id="sq" placeholder="Search sleep, nutrition, stress…"><button class="btn primary" type="submit" style="padding-inline:28px">Search</button></form><div class="lib" id="lib"></div>';
  function draw(q){
    q=(q||'').toLowerCase();
    var r=LIB.filter(function(x){return !q||(x.title+x.sum+x.cat+x.src).toLowerCase().indexOf(q)>-1});
    document.getElementById('lib').innerHTML=r.length?r.map(function(x){
      return '<article class="card"><div class="meta"><span class="tag">'+esc(x.cat)+'</span><span>'+esc(x.src)+'</span></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.sum)+'</p><div class="foot2"><span>'+(x.rev?'Reviewed '+x.rev:'See source for review date')+'</span><a href="'+x.url+'" target="_blank" rel="noopener">Read source '+ic('chev',14)+'</a></div></article>';
    }).join(''):'<div class="empty" style="grid-column:1/-1">No library entries match “'+esc(q)+'”. Try sleep, water, stress, diet, or activity.</div>';
  }
  draw('');
  document.getElementById('sf').addEventListener('submit',function(e){e.preventDefault();draw(document.getElementById('sq').value)});
  document.getElementById('sq').addEventListener('input',function(e){draw(e.target.value)});
}

/* profile */
function sel(id,list,val){return '<select class="in" id="'+id+'">'+list.map(function(x){return '<option'+(x===val?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>'}
function vProfile(m,u){
  var p=u.profile;
  m.innerHTML='<header><h1>Profile &amp; privacy</h1><p class="sub">Only use optional context if you consent. You can delete your data at any time.</p></header>'+
  '<div class="pgrid"><form class="card" id="pf" novalidate><p class="sm" style="margin:0 0 4px">Signed in as '+esc(u.email)+'</p><div class="fgrid">'+
  '<div><label class="f" for="p-age">Age group</label>'+sel('p-age',OPT.age,p.age)+'</div>'+
  '<div><label class="f" for="p-lang">Preferred language</label>'+sel('p-lang',OPT.lang,p.lang)+'</div>'+
  '<div><label class="f" for="p-diet">Dietary preference</label>'+sel('p-diet',OPT.diet,p.diet)+'</div>'+
  '<div><label class="f" for="p-act">Activity level</label>'+sel('p-act',OPT.act,p.act)+'</div>'+
  '<div><label class="f" for="p-sleep">Sleep goal (hours)</label><input class="in" type="number" id="p-sleep" min="4" max="14" step="0.5" value="'+(p.sleep||8)+'"></div>'+
  '<div><label class="f" for="p-water">Hydration goal (glasses)</label><input class="in" type="number" id="p-water" min="1" max="20" step="1" value="'+(p.water||8)+'"></div>'+
  '<div style="grid-column:1/-1"><label class="f" for="p-goal">Wellness goal</label>'+sel('p-goal',OPT.goal,p.goal)+'</div></div>'+
  '<label class="f" for="p-ctx">Optional health context</label><textarea class="in" id="p-ctx" maxlength="500" placeholder="Anything you want general guidance to keep in mind (optional)">'+esc(p.context)+'</textarea>'+
  '<label class="check" for="p-consent"><input type="checkbox" id="p-consent"'+(p.consent?' checked':'')+'><span>I consent to using optional context for personalization.</span></label>'+
  '<div id="p-err"></div><div style="margin-top:22px;display:flex;align-items:center"><button class="btn primary" type="submit">Save preferences</button></div></form>'+
  '<div class="side-col"><div class="card privacy">'+ic('shieldok',26)+'<h3>Privacy by design</h3><p>Your records are isolated to your account. Admin views show aggregates only.</p></div>'+
  '<div class="card"><h3 class="t" style="font-size:24px">Delete account</h3><p class="sm" style="margin-block:10px 16px;font-size:15px">Permanently removes your account, conversations, and wellness records.</p><div id="delbox"><button class="btn danger" data-del-ask>Delete my data</button></div></div></div></div>';
  document.getElementById('pf').addEventListener('submit',function(ev){
    ev.preventDefault();
    var sl=+document.getElementById('p-sleep').value,wa=+document.getElementById('p-water').value,err=document.getElementById('p-err');
    if(!(sl>=4&&sl<=14)||!(wa>=1&&wa<=20)){err.innerHTML='<div class="err">Sleep goal should be 4 to 14 hours and hydration goal 1 to 20 glasses.</div>';return}
    err.innerHTML='';
    var g=function(i){return document.getElementById(i).value};
    u.profile={age:g('p-age'),lang:g('p-lang'),diet:g('p-diet'),act:g('p-act'),sleep:sl,water:wa,goal:g('p-goal'),context:g('p-ctx'),consent:document.getElementById('p-consent').checked};
    save();toast('Preferences saved');
  });
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-scroll],[data-toggle-theme],[data-signout],[data-q],[data-topic],[data-clear],[data-del],[data-sample],[data-del-ask],[data-del-yes],[data-del-no],[data-emerg]');
  if(!t)return;var u=me();
  if(t.hasAttribute('data-emerg')){e.preventDefault();var eu=me();curTopic='safety';go('guidance');setTimeout(function(){if(!eu)return;var i=QA.findIndex(function(x){return x.k==='urgent'});if(i>-1&&!asked(eu,QA[i].q))ask(i,eu);else drawPanel(eu)},80);return}
  if(t.hasAttribute('data-go')){go(t.getAttribute('data-go'));return}
  if(t.hasAttribute('data-scroll')){var el=document.getElementById(t.getAttribute('data-scroll'));if(el)el.scrollIntoView({behavior:'smooth'});return}
  if(t.hasAttribute('data-toggle-theme')){db.theme=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',db.theme);save();return}
  if(t.hasAttribute('data-signout')){db.session=null;save();go('');return}
  if(!u)return;
  if(t.hasAttribute('data-q')){ask(+t.getAttribute('data-q'),u)}
  else if(t.hasAttribute('data-topic')){curTopic=t.getAttribute('data-topic');drawPanel(u)}
  else if(t.hasAttribute('data-clear')){u.chat=[];save();drawMsgs(u);drawPanel(u)}
  else if(t.hasAttribute('data-del')){var d=t.getAttribute('data-del');u.entries=u.entries.filter(function(x){return x.date!==d});save();drawEntries(u);toast('Entry deleted')}
  else if(t.hasAttribute('data-sample')){
    [[1,5,8,0],[2,7,3.5,53],[3,6,7,30]].forEach(function(r){var d=new Date();d.setDate(d.getDate()-r[0]);var k=iso(d);if(!entryFor(u,k))u.entries.push({date:k,water:r[1],sleep:r[2],move:r[3],note:'Example entry'})});
    u.entries.sort(function(a,b){return a.date<b.date?1:-1});save();drawEntries(u);toast('Example entries added. Delete them any time.')}
  else if(t.hasAttribute('data-del-ask')){document.getElementById('delbox').innerHTML='<div class="confirm" role="alertdialog"><b>Delete your account and all records? This cannot be undone.</b><div style="display:flex;gap:10px"><button class="btn sm primary" style="background:var(--danger);border-color:var(--danger);color:#fff" data-del-yes>Yes, delete everything</button><button class="btn sm" data-del-no>Cancel</button></div></div>'}
  else if(t.hasAttribute('data-del-no')){document.getElementById('delbox').innerHTML='<button class="btn danger" data-del-ask>Delete my data</button>'}
  else if(t.hasAttribute('data-del-yes')){delete db.users[db.session];db.session=null;save();go('')}
});
applyTheme();render();
})();
</script>

</body></html>
